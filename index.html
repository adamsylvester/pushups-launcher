<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pushups</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pushups">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Pushups">
  <meta name="theme-color" content="#5cb898">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{height:100%}
    body{margin:0;display:flex;align-items:center;justify-content:center;background:#5cb898;color:#fff;font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    .bag{font-size:96px;line-height:1;margin-bottom:10px}
    h1{font-size:28px;margin:0 0 18px}
    ol{text-align:left;display:inline-block;margin:0 auto 22px;padding-left:22px}
    li{margin:6px 0}
    .btn{display:inline-block;background:#fff;color:#2f6e58;font-weight:700;padding:14px 22px;border-radius:14px;text-decoration:none;font-size:18px}
    .small{opacity:.85;font-size:14px;margin-top:16px}
    #launch{display:none}
  </style>
</head>
<body>
  <div id="setup">
    <div class="bag">💪</div>
    <h1>Pushups counter</h1>
    <ol>
      <li>Tap the <strong>Share</strong> button in Safari.</li>
      <li>Choose <strong>Add to Home Screen</strong>.</li>
      <li>Tap <strong>Add</strong>. The 💪 icon opens the counter.</li>
    </ol>
    <div><a class="btn" href="https://team.cvillegutterpros.com/counter">Open the counter now</a></div>
    <div class="small">Already on your home screen? Just tap the icon.</div>
  </div>
  <div id="launch">
    <div class="bag">💪</div>
    <div>Opening the counter…</div>
    <p><a class="btn" href="https://team.cvillegutterpros.com/counter">Tap here if it doesn't open</a></p>
  </div>
  <script>
    var APP = "https://team.cvillegutterpros.com/counter";
    var fromHomeScreen = (navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      location.search.indexOf("go") !== -1;
    if (fromHomeScreen) {
      document.getElementById("setup").style.display = "none";
      document.getElementById("launch").style.display = "block";
      location.replace(APP);
    }
  </script>
</body>
</html>
